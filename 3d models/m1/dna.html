<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
   <meta charset="UTF-8"/>
  <title>3D DNA Helix</title>
  <link rel="stylesheet" href="sdna.css" />
</head>
<div id="helix">
  <!-- Title -->
  <h1>3D DNA Helix Simulation</h1>

  <!-- DNA Container -->
  <div class="dna-container">
    <div class="dna" id="dna"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="control">
      <label for="pairs">Base Pairs</label>
      <input type="range" id="pairs" min="20" max="100" value="40">
      <div class="value" id="pairsVal">40</div>
    </div>

    <div class="control">
      <label for="height">Height</label>
      <input type="range" id="height" min="200" max="800" value="500">
      <div class="value" id="heightVal">500</div>
    </div>

    <div class="control">
      <label for="radius">Radius</label>
      <input type="range" id="radius" min="50" max="250" value="150">
      <div class="value" id="radiusVal">150</div>
    </div>

    <div class="control">
      <label for="twist">Twist</label>
      <input type="range" id="twist" min="10" max="60" value="36">
      <div class="value" id="twistVal">36</div>
    </div>

    <div class="control">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="5" max="30" value="10">
      <div class="value" id="speedVal">10s</div>
    </div>
  </div>
</body>
  <script src="jdna.js"></script>
</div><hr>
</html>
